    <style>
  :root {
    --primary: #d62828;
    --primary-dark: #a91f1f;
    --primary-light: #ff5a5f;
    --text: #172033;
    --muted: #718096;
    --border: #e7eaf0;
    --white: #ffffff;
    --card-radius: 26px;
    --input-radius: 14px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    width: 100%;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
    padding: 24px;

    font-family: "Poppins", sans-serif;
    color: var(--text);

    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,.18), transparent 28%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,.12), transparent 30%),
      linear-gradient(135deg, #ff7676 0%, #e63946 48%, #b91c1c 100%);
  }

  /* ========================================================
     ANIMATED BACKGROUND
     ======================================================== */

  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(2px);
    opacity: .22;
    z-index: 0;
  }

  body::before {
    width: 420px;
    height: 420px;
    top: -180px;
    left: -130px;
    background: rgba(255,255,255,.35);
    animation: floatOrb 9s ease-in-out infinite;
  }

  body::after {
    width: 500px;
    height: 500px;
    right: -220px;
    bottom: -250px;
    background: rgba(255,255,255,.20);
    animation: floatOrbReverse 11s ease-in-out infinite;
  }

  @keyframes floatOrb {
    0%, 100% {
      transform: translate3d(0, 0, 0) scale(1);
    }
    50% {
      transform: translate3d(35px, 25px, 0) scale(1.08);
    }
  }

  @keyframes floatOrbReverse {
    0%, 100% {
      transform: translate3d(0, 0, 0) scale(1);
    }
    50% {
      transform: translate3d(-30px, -25px, 0) scale(1.1);
    }
  }

  /* ========================================================
     LOGIN CARD
     ======================================================== */

  .login-box {
    width: min(440px, 100%);
    position: relative;
    z-index: 2;

    padding: 42px 38px 34px;

    background: rgba(255,255,255,.96);
    border: 1px solid rgba(255,255,255,.75);
    border-radius: var(--card-radius);

    box-shadow:
      0 30px 70px rgba(65, 12, 12, .24),
      0 8px 24px rgba(0,0,0,.10);

    text-align: center;

    animation:
      cardEnter .75s cubic-bezier(.22,1,.36,1) both;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .login-box::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(
      135deg,
      rgba(255,255,255,.45),
      transparent 45%
    );
  }

  @keyframes cardEnter {
    from {
      opacity: 0;
      transform: translateY(28px) scale(.96);
    }

    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* ========================================================
     LOGO
     ======================================================== */

  .logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 11px;

    margin-bottom: 12px;

    color: var(--primary);
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -.5px;

    text-decoration: none !important;

    animation: logoEnter .8s .15s both;
  }

  .logo:visited,
  .logo:hover,
  .logo:active,
  .logo:focus {
    color: var(--primary);
    text-decoration: none !important;
  }

  .logo i {
    width: 42px;
    height: 42px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    color: #fff;
    background: linear-gradient(
      145deg,
      var(--primary-light),
      var(--primary-dark)
    );

    box-shadow:
      0 8px 20px rgba(214,40,40,.28);

    animation: dropPulse 2.8s ease-in-out infinite;
  }

  @keyframes logoEnter {
    from {
      opacity: 0;
      transform: translateY(-12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes dropPulse {
    0%, 100% {
      transform: translateY(0) rotate(0deg);
    }
    50% {
      transform: translateY(-4px) rotate(-3deg);
    }
  }

  .logo span {
    text-decoration: none !important;
  }

  /* ========================================================
     TITLE
     ======================================================== */

  h2 {
    margin: 4px 0 28px;

    color: var(--text);
    font-size: 28px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -.7px;

    animation: contentEnter .7s .2s both;
  }

  @keyframes contentEnter {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ========================================================
     INPUTS
     ======================================================== */

  .input-group {
    position: relative;
    margin-bottom: 16px;

    animation: contentEnter .7s .3s both;
  }

  .input-group > i:first-child {
    position: absolute;
    left: 17px;
    top: 50%;
    transform: translateY(-50%);

    color: #9aa4b2;
    font-size: 15px;

    transition:
      color .25s ease,
      transform .25s ease;
    z-index: 2;
  }

  .input-group:focus-within > i:first-child {
    color: var(--primary);
    transform: translateY(-50%) scale(1.08);
  }

  input {
    width: 100%;
    height: 56px;

    padding: 0 48px;

    border: 1.5px solid var(--border);
    border-radius: var(--input-radius);

    outline: none;

    background: #f9fafc;
    color: var(--text);

    font-family: inherit;
    font-size: 15px;

    transition:
      border-color .25s ease,
      background .25s ease,
      box-shadow .25s ease,
      transform .25s ease;
  }

  input::placeholder {
    color: #9aa4b2;
  }

  input:hover {
    border-color: #d8dde6;
    background: #fff;
  }

  input:focus {
    border-color: var(--primary);
    background: #fff;

    box-shadow:
      0 0 0 4px rgba(214,40,40,.10),
      0 8px 24px rgba(214,40,40,.08);

    transform: translateY(-1px);
  }

  .toggle-password {
    position: absolute;
    right: 17px;
    top: 50%;
    transform: translateY(-50%);

    color: #8b95a3;
    cursor: pointer;

    transition:
      color .2s ease,
      transform .2s ease;
    z-index: 3;
  }

  .toggle-password:hover {
    color: var(--primary);
    transform: translateY(-50%) scale(1.1);
  }

  /* ========================================================
     LOGIN BUTTON
     ======================================================== */

  #loginBtn {
    width: 100%;
    height: 56px;

    margin-top: 7px;

    border: none;
    border-radius: var(--input-radius);

    color: #fff;
    background:
      linear-gradient(
        135deg,
        #ef4444,
        var(--primary)
      );

    font-family: inherit;
    font-size: 16px;
    font-weight: 700;

    cursor: pointer;

    position: relative;
    overflow: hidden;

    box-shadow:
      0 10px 25px rgba(214,40,40,.25);

    transition:
      transform .25s ease,
      box-shadow .25s ease,
      filter .25s ease;

    animation: contentEnter .7s .4s both;
  }

  #loginBtn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 80%;
    height: 100%;

    background: linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.35),
      transparent
    );

    transform: skewX(-20deg);
    transition: left .7s ease;
  }

  #loginBtn:hover {
    transform: translateY(-2px);
    box-shadow:
      0 14px 32px rgba(214,40,40,.34);
    filter: brightness(1.03);
  }

  #loginBtn:hover::before {
    left: 140%;
  }

  #loginBtn:active {
    transform: translateY(0) scale(.985);
  }

  #loginBtn:focus-visible {
    outline: 3px solid rgba(214,40,40,.20);
    outline-offset: 3px;
  }

  /* ========================================================
     FORGOT PASSWORD
     ======================================================== */

  .forgot {
    display: inline-block;

    margin-top: 17px;

    color: #687386;
    font-size: 14px;
    font-weight: 500;

    cursor: pointer;

    transition:
      color .2s ease,
      transform .2s ease;
  }

  .forgot:hover {
    color: var(--primary);
    transform: translateY(-1px);
    text-decoration: none;
  }

  /* ========================================================
     FOOTER
     ======================================================== */

  .footer {
    margin-top: 27px;
    padding-top: 18px;

    border-top: 1px solid #eef0f4;

    color: #9aa2af;
    font-size: 12px;
  }

  /* ========================================================
     FORGOT PASSWORD MODAL
     ======================================================== */

  .modal {
    position: fixed;
    inset: 0;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(20, 24, 35, .58);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    z-index: 1000;
  }

  .modal.active {
    display: flex;
    animation: modalBackdrop .25s ease both;
  }

  @keyframes modalBackdrop {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  .modal-content {
    width: min(420px, 100%);

    padding: 34px 30px 30px;

    border: 1px solid rgba(255,255,255,.75);
    border-radius: 24px;

    background: rgba(255,255,255,.98);

    box-shadow:
      0 35px 90px rgba(0,0,0,.28);

    text-align: center;

    position: relative;

    animation:
      modalEnter .45s cubic-bezier(.22,1,.36,1) both;
  }

  @keyframes modalEnter {
    from {
      opacity: 0;
      transform: translateY(18px) scale(.94);
    }

    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .modal-content::before {
    content: "🔐";

    width: 58px;
    height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 15px;

    border-radius: 18px;

    background: #fff1f1;

    font-size: 25px;
  }

  .modal-content h3 {
    margin-bottom: 9px;

    color: var(--text);
    font-size: 23px;
    font-weight: 700;
  }

  .modal-content p {
    margin-bottom: 4px;
    line-height: 1.6;
    color: var(--muted) !important;
  }

  .modal-content input {
    width: 100%;
    height: 54px;

    margin-top: 16px;
    padding: 0 16px;

    border: 1.5px solid var(--border);
    border-radius: var(--input-radius);
  }

  .modal-content button {
    width: 100%;
    height: 54px;

    margin-top: 13px;

    border: none;
    border-radius: var(--input-radius);

    color: #fff;
    background: linear-gradient(135deg, #ef4444, var(--primary));

    font-family: inherit;
    font-size: 15px;
    font-weight: 700;

    cursor: pointer;

    transition:
      transform .2s ease,
      box-shadow .2s ease;
  }

  .modal-content button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(214,40,40,.25);
  }

  .close-btn {
    position: absolute;

    top: 14px;
    right: 16px;

    width: 34px;
    height: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: #697386;
    background: #f4f5f7;

    font-size: 22px;
    line-height: 1;

    cursor: pointer;

    transition:
      background .2s ease,
      color .2s ease,
      transform .2s ease;
  }

  .close-btn:hover {
    color: var(--primary);
    background: #fff0f0;
    transform: rotate(90deg);
  }

  /* ========================================================
     TOAST
     ======================================================== */

  #toast {
    position: fixed;

    left: 50%;
    bottom: 28px;

    transform: translate(-50%, 25px);

    min-width: 280px;
    max-width: calc(100vw - 32px);

    padding: 13px 20px;

    border-radius: 13px;

    color: #fff;

    opacity: 0;
    visibility: hidden;

    pointer-events: none;

    box-shadow:
      0 12px 35px rgba(0,0,0,.20);

    transition:
      opacity .3s ease,
      transform .3s ease,
      visibility .3s ease;

    z-index: 2000;
  }

  #toast.show {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
  }

  /* ========================================================
     RESPONSIVE
     ======================================================== */

  @media (max-width: 520px) {
    body {
      padding: 16px;
    }

    .login-box {
      padding: 34px 22px 27px;
      border-radius: 22px;
    }

    .logo {
      font-size: 22px;
    }

    .logo i {
      width: 38px;
      height: 38px;
    }

    h2 {
      font-size: 25px;
      margin-bottom: 23px;
    }

    input,
    #loginBtn {
      height: 54px;
    }

    .modal-content {
      padding: 32px 21px 25px;
    }
  }

  /* ========================================================
     ACCESSIBILITY
     ======================================================== */

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>

  <script>
      function showToast(msg, color = "#333") {
        const toast = document.getElementById("toast");
        toast.textContent = msg;
        toast.style.background = color;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
      }

      async function login() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!email) {
          showToast("Please enter your admin email.", "#d32f2f");
          return;
        }
        if (!password) {
          showToast("Please enter your admin password.", "#d32f2f");
          return;
        }

        try {
          const res = await fetch("/api/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const data = await res.json();

          if (res.ok && data.success) {
            localStorage.setItem("adminToken", data.token);
            if (data.admin && data.admin.email) {
              localStorage.setItem("adminEmail", data.admin.email);
            }
            showToast("Login successful!", "#4caf50");
            setTimeout(() => (window.location.href = "admin.html"), 1000);
          } else {
            showToast(data.message || "Invalid credentials", "#d32f2f");
          }
        } catch (error) {
          console.error("Login error:", error);
          showToast("Server error. Please try again.", "#d32f2f");
        }
      }

      function openModal() {
        document.getElementById("resetModal").classList.add("active");
      }

      function closeModal() {
        document.getElementById("resetModal").classList.remove("active");
      }

      async function sendResetLink() {
        const email = document.getElementById("resetEmail").value.trim();
        if (!email) {
          showToast("Enter your email first.", "#d32f2f");
          return;
        }

        try {
          const res = await fetch("/api/admin/forgot", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });

          const data = await res.json();
          if (res.ok && data.success) {
            showToast(
              data.message || "Reset link sent to your email!",
              "#4caf50",
            );
            closeModal();
            document.getElementById("resetEmail").value = "";
          } else {
            showToast(data.message || "Failed to send reset link.", "#d32f2f");
          }
        } catch (error) {
          console.error("Reset link error:", error);
          showToast("Server error. Please try again.", "#d32f2f");
        }
      }

      // Allow Enter key to submit login
      document
        .getElementById("password")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            login();
          }
        });
      document
        .getElementById("email")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            login();
          }
        });

      function togglePassword() {
        const passwordInput = document.getElementById("password");
        const icon = document.querySelector(".toggle-password");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          passwordInput.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      }

      document.getElementById("loginBtn").addEventListener("click", login);

      document
        .querySelector(".toggle-password")
        .addEventListener("click", togglePassword);

      document.getElementById("forgotBtn").addEventListener("click", openModal);

      document
        .getElementById("resetBtn")
        .addEventListener("click", sendResetLink);

      document.getElementById("closeBtn").addEventListener("click", closeModal);
    </script>
  <script id="jj-premium-admin-login-v3-js">
(function () {
    "use strict";

    document.addEventListener("DOMContentLoaded", function () {

        /* ----------------------------------------------------
           SECURITY BADGE
           ---------------------------------------------------- */

        const title =
            document.querySelector("#loginTitle") ||
            document.querySelector(
                ".login-card h2, .login-box h2, .auth-card h2, .admin-login-card h2"
            );

        if (title && !document.querySelector(".jj-security-line")) {

            const security = document.createElement("div");

            security.className = "jj-security-line";

            security.innerHTML =
                '<span class="jj-security-dot"></span>' +
                '<span>Secure Administrator Access</span>';

            title.insertAdjacentElement("afterend", security);
        }

        /* ----------------------------------------------------
           BACKGROUND PARTICLES
           ---------------------------------------------------- */

        if (!document.querySelector(".jj-bg-particle")) {

            const positions = [
                ["8%", "24%", "0s"],
                ["92%", "28%", "2.5s"],
                ["15%", "78%", "4s"],
                ["87%", "72%", "1.5s"]
            ];

            positions.forEach(function (item) {

                const particle =
                    document.createElement("span");

                particle.className =
                    "jj-bg-particle";

                particle.style.left =
                    item[0];

                particle.style.top =
                    item[1];

                particle.style.animationDelay =
                    item[2];

                document.body.appendChild(
                    particle
                );
            });
        }

        /* ----------------------------------------------------
           FORM MICRO-INTERACTIONS
           ---------------------------------------------------- */

        const form =
            document.querySelector(
                ".login-card form, " +
                ".login-box form, " +
                ".auth-card form, " +
                ".admin-login-card form"
            ) ||
            document.querySelector("form");

        if (!form) return;

        const inputs =
            form.querySelectorAll(
                "input[type='email'], " +
                "input[type='password'], " +
                "input[type='text']"
            );

        inputs.forEach(function (input) {

            input.addEventListener("focus", function () {

                const wrapper =
                    input.closest(
                        ".form-group, .input-group, .field"
                    );

                if (wrapper) {
                    wrapper.classList.add(
                        "jj-field-active"
                    );
                }
            });

            input.addEventListener("blur", function () {

                const wrapper =
                    input.closest(
                        ".form-group, .input-group, .field"
                    );

                if (wrapper) {
                    wrapper.classList.remove(
                        "jj-field-active"
                    );
                }
            });
        });

        /* ----------------------------------------------------
           LOGIN LOADING ANIMATION
           ---------------------------------------------------- */

        const submitButton =
            form.querySelector(
                "button[type='submit'], " +
                "input[type='submit'], " +
                "#loginBtn, " +
                ".login-btn"
            );

        if (submitButton) {

            form.addEventListener(
                "submit",
                function () {

                    if (
                        submitButton.disabled ||
                        submitButton.classList.contains(
                            "jj-login-loading"
                        )
                    ) {
                        return;
                    }

                    submitButton.classList.add(
                        "jj-login-loading"
                    );

                    /*
                     * Safety reset in case authentication
                     * returns no navigation/error state.
                     * Does not interfere with existing auth.
                     */
                    window.setTimeout(function () {

                        submitButton.classList.remove(
                            "jj-login-loading"
                        );

                    }, 10000);
                },
                true
            );
        }

        /* ----------------------------------------------------
           PASSWORD TOGGLE — ACCESSIBILITY
           ---------------------------------------------------- */

        const password =
            form.querySelector(
                "input[type='password']"
            );

        if (password) {

            password.setAttribute(
                "autocomplete",
                "current-password"
            );
        }

        const email =
            form.querySelector(
                "input[type='email']"
            );

        if (email) {

            email.setAttribute(
                "autocomplete",
                "username"
            );
        }

    });
})();
</script>

<script id="jharjeevan-close-script">
(function () {
    function setupForgotPasswordClose() {
        const modal = document.getElementById('resetModal');
        const closeBtn = document.getElementById('closeBtn');
        const forgotBtn = document.getElementById('forgotBtn');

        if (!modal || !closeBtn) return;

        function closeForgotModal() {
            modal.classList.remove(
                'show',
                'open',
                'active',
                'visible'
            );

            modal.classList.add('jharjeevan-force-hidden');

            modal.setAttribute('aria-hidden', 'true');

            /* Remove any inline display value */
            modal.style.removeProperty('display');
        }

        function openForgotModal() {
            modal.classList.remove('jharjeevan-force-hidden');
            modal.removeAttribute('aria-hidden');
        }

        /* X button */
        closeBtn.addEventListener('click', function (event) {
            event.preventDefault();
            event.stopPropagation();

            closeForgotModal();
        }, true);

        /* Keyboard accessibility */
        closeBtn.addEventListener('keydown', function (event) {
            if (
                event.key === 'Enter' ||
                event.key === ' ' ||
                event.key === 'Escape'
            ) {
                event.preventDefault();
                event.stopPropagation();

                closeForgotModal();
            }
        }, true);

        /* Escape key anywhere */
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                closeForgotModal();
            }
        });

        /* Clicking the dark backdrop closes it */
        modal.addEventListener('click', function (event) {
            if (event.target === modal) {
                closeForgotModal();
            }
        });

        /* When Forgot Password is clicked, allow modal to open again */
        if (forgotBtn) {
            forgotBtn.addEventListener('click', function () {
                openForgotModal();
            }, true);

            forgotBtn.addEventListener('keydown', function (event) {
                if (
                    event.key === 'Enter' ||
                    event.key === ' '
                ) {
                    openForgotModal();
                }
            }, true);
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener(
            'DOMContentLoaded',
            setupForgotPasswordClose
        );
    } else {
        setupForgotPasswordClose();
    }
})();
</script>
