<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <meta name="theme-color" content="#e11d2e">
    <meta name="description" content="Reset your JharJeevan Blood Bank client password">
    <title>Forgot Password | JharJeevan Blood Bank</title>

    <link rel="stylesheet" href="client.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>
    <main class="auth-page">
        <section class="auth-card recovery-card">

            <div class="auth-brand">
                <div class="brand-mark" aria-hidden="true"><i class="fas fa-heart"></i></div>
                <div>
                    <h1>JharJeevan</h1>
                    <span>Blood Bank</span>
                </div>
            </div>

                        <div class="auth-header recovery-header">
                <p class="eyebrow">
                    ACCOUNT RECOVERY
                </p>

                <h2>
                    Forgot your password?
                </h2>

                <p>
                    No worries. Enter your registered email and we'll
                    send you a secure link to create a new password.
                </p>
            </div>
            <div class="recovery-security-note">
                <span class="recovery-security-icon" aria-hidden="true">
                    <i class="fas fa-shield-halved"></i>
                </span>

                <span>
                    Your reset link is private and expires automatically.
                </span>
            </div>

            <form id="clientForgotPasswordForm" novalidate>

                <label>
                    Email address

                    <input
                        id="forgotEmail"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >
                </label>

                <div
                    id="forgotPasswordMessage"
                    class="form-message recovery-message"
                    role="alert"
                    aria-live="polite">
                </div>

                <button id="forgotPasswordButton" type="submit">
                    <span class="button-text">
                        <i class="fas fa-paper-plane"></i>
                        Email Me a Reset Link
                    </span>

                    <span class="button-loading">
                        Sending...
                    </span>
                </button>

            </form>

            <div class="auth-switch">
                Remember your password?
                <a href="client-login.html">Back to login</a>
            </div>

            <a class="back-link" href="index.html">
                &larr; Back to website
            </a>

        </section>
    </main>

    <script src="client-password-reset.js"></script>
    <script src="auth-ui.js"></script></body>
</html>
