<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <meta name="theme-color" content="#e11d2e">
    <meta name="description" content="JharJeevan Blood Bank Client Login">
    <title>Client Login | JharJeevan Blood Bank</title>
    <link rel="stylesheet" href="client.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-brand">
                <div class="brand-mark" aria-hidden="true"><i class="fas fa-heart"></i></div>
                <div>
                    <h1>JharJeevan</h1>
                    <span>Blood Bank</span>
                </div>
            </div>

            <div class="auth-header">
                <p class="eyebrow">CLIENT PORTAL</p>
                <h2>Welcome back</h2>
                <p>Sign in to manage your blood requests and donor profile.</p>
            </div>

            <form id="clientLoginForm" novalidate>
                <label>
                    Email
                    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                </label>

                <label>
                    Password
                    <div class="password-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button type="button" class="password-toggle" data-password-toggle="#password" aria-label="Show password"><i class="fas fa-eye"></i></button></div>
                </label>

                <div class="auth-forgot">
                    <a href="client-forgot-password.html">
                        Forgot your password?
                    </a>
                </div>

                <div id="loginMessage" class="form-message" role="alert"></div>

                <button id="loginButton" type="submit">
                    <span class="button-text">Sign In</span>
                    <span class="button-loading">Signing in...</span>
                </button>
            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="client-register.html">Create account</a>
            </p>

            <a class="back-link" href="index.html">&larr; Back to website</a>
        </section>
    </main>

    <script src="client.js"></script>
    <script src="auth-ui.js"></script></body>
</html>
