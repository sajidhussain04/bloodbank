  <style>
    /* =========================================================
       RESET PASSWORD — JHARJEEVAN PREMIUM UI
       ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #dc2626;
      --primary-dark: #b91c1c;
      --primary-light: #fee2e2;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --white: #ffffff;
      --success: #16a34a;
      --danger: #dc2626;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      font-family: "Inter", sans-serif;
      color: var(--text);

      background: linear-gradient(135deg, #ff5a60 0%, #ef3340 45%, #c9182b 100%);

      overflow-x: hidden;
    }

    /* =========================================================
       BACKGROUND ANIMATION
       ========================================================= */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.45;
      animation: floatOrb 9s ease-in-out infinite;
    }

    .orb.one {
      width: 180px;
      height: 180px;
      top: 8%;
      left: 8%;
      background: rgba(255,255,255,0.12);
    }

    .orb.two {
      width: 240px;
      height: 240px;
      right: 5%;
      bottom: 5%;
      background: rgba(255,255,255,0.08);
      animation-delay: -3s;
    }

    .orb.three {
      width: 110px;
      height: 110px;
      right: 20%;
      top: 12%;
      background: rgba(255,255,255,0.10);
      animation-delay: -6s;
    }

    @keyframes floatOrb {
      0%,
      100% {
        transform: translate3d(0, 0, 0);
      }

      50% {
        transform: translate3d(0, -22px, 0);
      }
    }

    /* =========================================================
       MAIN CARD
       ========================================================= */

    .reset-card {
      position: relative;
      z-index: 2;

      width: min(100%, 470px);

      padding: 42px 42px 34px;

      background: rgba(255,255,255,0.97);

      border: 1px solid rgba(255, 255, 255, 0.85);

      border-radius: 28px;

      box-shadow:
        0 30px 80px rgba(80, 0, 10, 0.28),
        0 8px 25px rgba(0, 0, 0, 0.10);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      animation: cardEnter 0.75s cubic-bezier(.22, 1, .36, 1);
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(35px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Top red line */

    .reset-card::before {
      content: "";
      position: absolute;

      top: 0;
      left: 15%;
      right: 15%;

      height: 4px;

      border-radius: 0 0 10px 10px;

      background: linear-gradient(
        90deg,
        #ef4444,
        #dc2626,
        #991b1b
      );

      animation: lineReveal 1s ease;
    }

    @keyframes lineReveal {
      from {
        transform: scaleX(0);
        opacity: 0;
      }

      to {
        transform: scaleX(1);
        opacity: 1;
      }
    }

    /* =========================================================
       BRAND
       ========================================================= */

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;

      margin-bottom: 28px;

      text-decoration: none;
      color: var(--text);

      animation: fadeUp 0.65s ease 0.1s both;
    }

    .brand-icon {
      width: 48px;
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;

      color: white;

      background: linear-gradient(
        135deg,
        #ef4444,
        #b91c1c
      );

      box-shadow:
        0 10px 24px rgba(220, 38, 38, 0.28);

      animation: iconPulse 3s ease-in-out infinite;
    }

    .brand-icon i {
      font-size: 21px;
    }

    .brand-name {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.7px;
    }

    .brand-name span {
      color: var(--primary);
    }

    @keyframes iconPulse {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    /* =========================================================
       HEADING
       ========================================================= */

    .heading {
      text-align: center;
      margin-bottom: 30px;

      animation: fadeUp 0.65s ease 0.2s both;
    }

    .heading h1 {
      font-size: 30px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -1px;

      margin-bottom: 10px;
    }

    .heading p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    /* =========================================================
       FORM
       ========================================================= */

    .form-group {
      margin-bottom: 20px;

      animation: fadeUp 0.65s ease 0.3s both;
    }

    .form-group:nth-of-type(2) {
      animation-delay: 0.4s;
    }

    .form-label {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 8px;

      font-size: 13px;
      font-weight: 700;
      color: #374151;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;

      left: 16px;
      top: 50%;

      transform: translateY(-50%);

      color: #9ca3af;

      transition:
        color 0.25s ease,
        transform 0.25s ease;

      pointer-events: none;
    }

    .password-input {
      width: 100%;
      height: 56px;

      padding: 0 50px 0 46px;

      border: 1.5px solid var(--border);
      border-radius: 15px;

      outline: none;

      background: #ffffff;

      color: var(--text);

      font-family: inherit;
      font-size: 14px;

      transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease,
        background 0.25s ease;
    }

    .password-input::placeholder {
      color: #9ca3af;
    }

    .password-input:hover {
      border-color: #d1d5db;
    }

    .password-input:focus {
      border-color: var(--primary);

      background: #fff;

      box-shadow:
        0 0 0 4px rgba(220, 38, 38, 0.09);

      transform: translateY(-1px);
    }

    .password-input:focus ~ .input-icon {
      color: var(--primary);
    }

    .toggle-password {
      position: absolute;

      right: 15px;
      top: 50%;

      transform: translateY(-50%);

      border: 0;
      background: transparent;

      color: #9ca3af;

      cursor: pointer;

      width: 30px;
      height: 30px;

      border-radius: 8px;

      transition:
        color 0.2s ease,
        background 0.2s ease;
    }

    .toggle-password:hover {
      color: var(--primary);
      background: var(--primary-light);
    }

    /* =========================================================
       PASSWORD STRENGTH
       ========================================================= */

    .strength {
      margin-top: 9px;

      opacity: 0;
      height: 0;
      overflow: hidden;

      transition:
        opacity 0.25s ease,
        height 0.25s ease;
    }

    .strength.visible {
      opacity: 1;
      height: 35px;
    }

    .strength-bars {
      display: flex;
      gap: 5px;
      margin-bottom: 6px;
    }

    .strength-bars span {
      flex: 1;
      height: 4px;

      border-radius: 10px;

      background: #e5e7eb;

      transition:
        background 0.3s ease,
        transform 0.3s ease;
    }

    .strength-text {
      font-size: 11px;
      color: var(--muted);
    }

    /* =========================================================
       BUTTON
       ========================================================= */

    .update-btn {
      position: relative;
      overflow: hidden;

      width: 100%;
      height: 56px;

      margin-top: 4px;

      border: 0;
      border-radius: 15px;

      color: white;

      background: linear-gradient(
        135deg,
        #ef4444,
        #dc2626 55%,
        #b91c1c
      );

      font-family: inherit;
      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 12px 25px rgba(220, 38, 38, 0.24);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        filter 0.25s ease;

      animation: fadeUp 0.65s ease 0.5s both;
    }

    .update-btn::before {
      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 80%;
      height: 100%;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.30),
        transparent
      );

      transform: skewX(-20deg);

      transition: left 0.65s ease;
    }

    .update-btn:hover {
      transform: translateY(-3px);

      box-shadow:
        0 18px 34px rgba(220, 38, 38, 0.30);

      filter: brightness(1.03);
    }

    .update-btn:hover::before {
      left: 140%;
    }

    .update-btn:active {
      transform: translateY(-1px);
    }

    .update-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
      transform: none;
    }

    .btn-content {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    /* =========================================================
       BACK TO LOGIN
       ========================================================= */

    .back-link {
      display: flex;
      justify-content: center;

      margin-top: 22px;

      animation: fadeUp 0.65s ease 0.6s both;
    }

    .back-link a {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      color: var(--muted);

      text-decoration: none;

      font-size: 13px;
      font-weight: 600;

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    .back-link a:hover {
      color: var(--primary);
      transform: translateX(-3px);
    }

    /* =========================================================
       MESSAGE
       ========================================================= */

    .message {
      display: none;

      margin-top: 18px;

      padding: 13px 15px;

      border-radius: 13px;

      font-size: 13px;
      line-height: 1.5;
      font-weight: 600;

      text-align: center;

      animation: messageIn 0.35s ease;
    }

    .message.error {
      display: block;

      color: #991b1b;
      background: #fef2f2;

      border: 1px solid #fecaca;
    }

    .message.success {
      display: block;

      color: #166534;
      background: #f0fdf4;

      border: 1px solid #bbf7d0;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .footer {
      margin-top: 25px;

      text-align: center;

      color: #9ca3af;

      font-size: 11px;

      animation: fadeUp 0.65s ease 0.7s both;
    }

    /* =========================================================
       GENERAL ANIMATION
       ========================================================= */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .reset-card {
        padding: 34px 22px 27px;
        border-radius: 23px;
      }

      .brand {
        margin-bottom: 23px;
      }

      .brand-name {
        font-size: 22px;
      }

      .brand-icon {
        width: 43px;
        height: 43px;
      }

      .heading h1 {
        font-size: 26px;
      }

      .heading {
        margin-bottom: 25px;
      }

      .password-input,
      .update-btn {
        height: 54px;
      }
    }

    /* =========================================================
       ACCESSIBILITY
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

  <script>
    /* =========================================================
       PASSWORD VISIBILITY
       ========================================================= */

    function setupPasswordToggle(buttonId, inputId) {
      const button = document.getElementById(buttonId);
      const input = document.getElementById(inputId);

      button.addEventListener("click", () => {
        const isPassword = input.type === "password";

        input.type = isPassword ? "text" : "password";

        button.innerHTML = isPassword
          ? '<i class="fas fa-eye-slash"></i>'
          : '<i class="fas fa-eye"></i>';

        button.setAttribute(
          "aria-label",
          isPassword ? "Hide password" : "Show password"
        );
      });
    }

    setupPasswordToggle("toggleNew", "newPass");
    setupPasswordToggle("toggleConfirm", "confirmPass");


    /* =========================================================
       PASSWORD STRENGTH
       ========================================================= */

    const newPassInput = document.getElementById("newPass");
    const strengthBox = document.getElementById("strengthBox");
    const strengthText = document.getElementById("strengthText");
    const strengthBars = strengthBox.querySelectorAll(".strength-bars span");

    newPassInput.addEventListener("input", () => {
      const password = newPassInput.value;

      if (!password) {
        strengthBox.classList.remove("visible");
        return;
      }

      strengthBox.classList.add("visible");

      let score = 0;

      if (password.length >= 6) score++;
      if (password.length >= 10) score++;
      if (/[A-Z]/.test(password) && /[a-z]/.test(password)) score++;
      if (/[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password)) score++;

      strengthBars.forEach((bar, index) => {
        bar.style.background =
          index < score ? "#16a34a" : "#e5e7eb";
      });

      if (score <= 1) {
        strengthText.textContent = "Weak password";
        strengthText.style.color = "#dc2626";
      } else if (score === 2) {
        strengthText.textContent = "Fair password";
        strengthText.style.color = "#d97706";
      } else if (score === 3) {
        strengthText.textContent = "Good password";
        strengthText.style.color = "#2563eb";
      } else {
        strengthText.textContent = "Strong password";
        strengthText.style.color = "#16a34a";
      }
    });


    /* =========================================================
       MESSAGE
       ========================================================= */

    const msgBox = document.getElementById("msgBox");

    function showMessage(message, type) {
      msgBox.textContent = message;
      msgBox.className = "message " + type;
    }


    /* =========================================================
       RESET PASSWORD
       ========================================================= */

    const updateBtn = document.getElementById("updateBtn");

    updateBtn.addEventListener("click", resetPass);

    async function resetPass() {

      const token =
        new URLSearchParams(window.location.search).get("token");

      const newPassword =
        document.getElementById("newPass").value.trim();

      const confirmPassword =
        document.getElementById("confirmPass").value.trim();


      /* Token */

      if (!token) {
        showMessage(
          "This password reset link is invalid or incomplete. Please request a new reset link.",
          "error"
        );

        return;
      }


      /* Password */

      if (!newPassword) {
        showMessage(
          "Please enter your new password.",
          "error"
        );

        document.getElementById("newPass").focus();

        return;
      }


      /* Minimum length */

      if (newPassword.length < 6) {
        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        document.getElementById("newPass").focus();

        return;
      }


      /* Confirm */

      if (!confirmPassword) {
        showMessage(
          "Please confirm your new password.",
          "error"
        );

        document.getElementById("confirmPass").focus();

        return;
      }


      /* Match */

      if (newPassword !== confirmPassword) {
        showMessage(
          "Passwords do not match. Please check both fields.",
          "error"
        );

        document.getElementById("confirmPass").focus();

        return;
      }


      /* Loading */

      updateBtn.disabled = true;

      updateBtn.innerHTML = `
        <span class="btn-content">
          <i class="fas fa-spinner fa-spin"></i>
          <span>Updating Password...</span>
        </span>
      `;


      try {

        const response = await fetch(
          `/api/admin/reset/${token}`,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              newPassword
            })
          }
        );


        const data = await response.json();


        if (!response.ok) {

          showMessage(
            data.message ||
            "Unable to reset your password. Please request a new reset link.",
            "error"
          );

          updateBtn.disabled = false;

          updateBtn.innerHTML = `
            <span class="btn-content">
              <i class="fas fa-key"></i>
              <span>Update Password</span>
            </span>
          `;

          return;
        }


        /* Success */

        showMessage(
          "Password updated successfully. Redirecting you to Admin Login...",
          "success"
        );


        updateBtn.innerHTML = `
          <span class="btn-content">
            <i class="fas fa-check"></i>
            <span>Password Updated</span>
          </span>
        `;


        setTimeout(() => {
          window.location.href = "admin-login.html";
        }, 2200);


      } catch (error) {

        console.error("Password reset error:", error);

        showMessage(
          "Unable to connect to the server. Please try again.",
          "error"
        );

        updateBtn.disabled = false;

        updateBtn.innerHTML = `
          <span class="btn-content">
            <i class="fas fa-key"></i>
            <span>Update Password</span>
          </span>
        `;
      }
    }


    /* =========================================================
       ENTER KEY SUPPORT
       ========================================================= */

    document
      .getElementById("confirmPass")
      .addEventListener("keydown", (event) => {

        if (event.key === "Enter") {
          resetPass();
        }

      });

  </script>
